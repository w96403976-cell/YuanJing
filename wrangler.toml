# 官網（靜態頁面）。LINE 機器人在 line-bot/，是另一個 Worker，不在這裡部署
name = "yuanjing"
main = "site-worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./"
binding = "ASSETS"
# 只有影片先經過 site-worker.js（處理 Range），其他檔案直接由 assets 提供
run_worker_first = ["/assets/video/*"]

# 非 main 分支的預覽建置（Cloudflare Workers Builds 的 wrangler preview 需要這個區塊）
[previews]
